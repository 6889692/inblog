name: Deploy Inkstone to Cloudflare Workers (KV Mode)

on:
  push:
    branches:
      - main     # 如果你的默认分支是 master，请修改为 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # 建议固定使用稳定性较好的 22 或 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      # 直接通过标准的 npm 脚本执行 KV 部署，并注入 Cloudflare 环境变量
      - name: Deploy via npm script (KV)
        run: npm run deploy:kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
